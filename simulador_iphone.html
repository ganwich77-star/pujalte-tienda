<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador iPhone 17 Pro Max - Pujalte Studio</title>
    <style>
        :root {
            --iphone-width: 440px;
            --iphone-height: 940px;
            --bezel-width: 12px;
            --border-radius: 65px;
            --frame-color: #2c2c2e;
            --screen-bg: #000;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1c1c1e 0%, #000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Contenedor del Simulador */
        .simulator-container {
            position: relative;
            transform: scale(0.8); /* Ajustar según pantalla */
            filter: drop-shadow(0 50px 100px rgba(0,0,0,0.6));
        }

        /* Cuerpo del iPhone */
        .iphone-frame {
            width: var(--iphone-width);
            height: var(--iphone-height);
            background: var(--frame-color);
            border-radius: var(--border-radius);
            position: relative;
            padding: var(--bezel-width);
            box-sizing: border-box;
            box-shadow: 
                inset 0 0 4px 2px rgba(255,255,255,0.05),
                0 0 0 1px rgba(255,255,255,0.1),
                0 0 0 4px #333;
            border: 2px solid #000;
        }

        /* Pantalla */
        .screen {
            width: 100%;
            height: 100%;
            background: var(--screen-bg);
            border-radius: calc(var(--border-radius) - var(--bezel-width));
            overflow: hidden;
            position: relative;
            padding-top: 55px; /* Safe Area para la Isla Dinámica */
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .island-camera {
            width: 12px;
            height: 12px;
            background: #1a1a1a;
            border-radius: 50%;
            box-shadow: inset 0 0 2px rgba(255,255,255,0.2);
        }

        /* Botones Laterales */
        .button {
            position: absolute;
            background: #1a1a1a;
            border-radius: 2px;
        }

        .vol-up { width: 3px; height: 60px; left: -5px; top: 180px; }
        .vol-down { width: 3px; height: 60px; left: -5px; top: 255px; }
        .action-btn { width: 3px; height: 35px; left: -5px; top: 120px; }
        .power-btn { width: 3px; height: 100px; right: -5px; top: 220px; }
        .camera-control { width: 3px; height: 80px; right: -5px; top: 450px; border-radius: 4px; border-right: 1px solid rgba(255,255,255,0.1); }

        /* Controles Inferiores */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            z-index: 101;
        }

        /* Etiqueta superior */
        .simulator-label {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 300px;
        }

        .simulator-label h1 {
            color: #1d1d1f;
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .simulator-label p {
            color: #86868b;
            font-size: 14px;
            margin: 5px 0 0;
            font-weight: 500;
        }

        /* Info de conexión */
        .conn-info {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #4A7C59;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            white-space: nowrap;
        }

        /* Responsive */
        @media (max-height: 900px) {
            .simulator-container { transform: scale(0.6); }
        }
    </style>
</head>
<body>

    <div class="simulator-container">
        <!-- Labels -->
        <div class="simulator-label">
            <h1>iPhone 17 Pro Max</h1>
            <p>Pujalte Studio Simulator</p>
        </div>

        <!-- Frame -->
        <div class="iphone-frame">
            <!-- Buttons -->
            <div class="button action-btn"></div>
            <div class="button vol-up"></div>
            <div class="button vol-down"></div>
            <div class="button power-btn"></div>
            <div class="button camera-control"></div>

            <!-- Screen Area -->
            <div class="screen">
                <div class="dynamic-island">
                    <div class="island-camera"></div>
                </div>
                
                <!-- IFRAME A TU PROYECTO LOCAL -->
                <iframe src="http://localhost:3001" id="preview-frame"></iframe>

                <div class="home-indicator"></div>
            </div>
        </div>

        <!-- Connection Badge -->
        <div class="conn-info">
            • LIVE PREVIEW: http://localhost:3001
        </div>
    </div>

    <script>
        // Si quieres cambiar la URL dinámicamente o añadir controles
        /*
        window.addEventListener('message', (e) => {
            console.log("Simulador recibió mensaje:", e.data);
        });
        */
    </script>
</body>
</html>
